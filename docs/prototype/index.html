<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大盘行情看板 · 高保真交互原型</title>
<!--
  大盘行情看板 — 高保真可交互 HTML 原型（Task #21）
  · 完全自包含：内联 CSS/JS，零外部依赖、零网络请求，双击即可打开
  · 与真实产品对齐的视觉规格：暗色 gray-900/gray-800、红涨 #ef232a、绿跌 #14b143
  · 视图 1：行情看板（F1.1/F1.2/F1.3）  视图 2：指数详情（F2.1~F2.4）
  · 界面元素上的「F1.1 / F2.2」小角标对应《产品需求文档.md》功能编号，悬停可见说明
-->
<style>
/* ====================== 设计变量（对齐真实产品色板） ====================== */
:root{
  --up:#ef232a;          /* 涨（中国市场惯例红涨） */
  --down:#14b143;        /* 跌 */
  --bg:#111827;          /* gray-900 页面底色 */
  --panel:#1f2937;       /* gray-800 卡片/浮层 */
  --border:#374151;      /* gray-700 描边/网格 */
  --border-hi:#4b5563;   /* gray-600 悬停描边 */
  --text:#f3f4f6;        /* gray-100 主文字 */
  --muted:#9ca3af;       /* gray-400 次要文字（轴/图例同色） */
  --dim:#6b7280;         /* gray-500 辅助文字 */
  --blue:#3b82f6;        /* 轮询脉动指示 */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ====================== 标题栏（F1.2 / F1.3） ====================== */
.titlebar{
  flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border);user-select:none;
}
.tb-left{display:flex;align-items:center;gap:8px}
.tb-title{font-size:14px;font-weight:600;color:#e5e7eb;letter-spacing:.5px}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-time{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.tb-btn{
  font-size:12px;color:var(--muted);background:none;border:none;border-radius:4px;
  padding:4px 8px;cursor:pointer;transition:color .15s,background .15s;
}
.tb-btn:hover{color:#e5e7eb;background:var(--border)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ====================== 主内容区 ====================== */
.main{flex:1;overflow-y:auto;padding:16px}
.section{margin-bottom:24px}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.section-title{font-size:16px;font-weight:600;color:#d1d5db}
.section-line{flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}

/* ====================== 指数卡片（F1.1） ====================== */
.card{
  border-radius:8px;border:1px solid var(--border);border-left:4px solid var(--border);
  padding:16px;cursor:pointer;outline:none;
  transition:border-color .15s,background .15s,transform .15s;
}
.card:hover,.card:focus-visible{border-color:var(--border-hi);transform:translateY(-1px)}
.card.up{background:rgba(239,35,42,.05);border-left-color:var(--up)}
.card.down{background:rgba(20,177,67,.05);border-left-color:var(--down)}
.card.flat{background:var(--panel);border-left-color:var(--border-hi)}
.card-name{font-size:14px;color:var(--muted);margin-bottom:4px}
.card-price{font-size:24px;font-weight:700;margin-bottom:4px;font-variant-numeric:tabular-nums}
.card-chg{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:14px;font-variant-numeric:tabular-nums}
.card-vol{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.up-t{color:var(--up)}.down-t{color:var(--down)}.flat-t{color:var(--muted)}

/* ====================== 详情页头部（F2.1 / F2.4） ====================== */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.backbtn{
  flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;border:1px solid var(--border);background:none;color:#d1d5db;
  font-size:15px;cursor:pointer;transition:color .15s,background .15s;
}
.backbtn:hover{color:#fff;background:var(--panel)}
.dh-info{min-width:0}
.dh-name{font-size:18px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh-code{font-size:12px;color:var(--dim)}
.dh-quote{margin-left:auto;text-align:right;flex-shrink:0}
.dh-price{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.dh-sub{display:flex;justify-content:flex-end;gap:12px;font-size:14px;font-variant-numeric:tabular-nums}

/* ====================== Tab 栏（分时 / 日K / 周K / 月K） ====================== */
.tab-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.tabbar{
  display:inline-flex;gap:4px;padding:4px;border-radius:8px;
  background:rgba(31,41,55,.7);border:1px solid rgba(55,65,81,.5);
}
.tab{
  padding:6px 16px;font-size:12px;border:none;background:none;border-radius:6px;
  color:var(--muted);cursor:pointer;transition:color .15s,background .15s;
}
.tab:hover{color:#e5e7eb}
.tab.active{background:var(--border);color:#fff;font-weight:500}

/* ====================== 图表容器 ====================== */
.chart-wrap{position:relative;height:320px}
@media(max-width:767px){.chart-wrap{height:280px}}
.chart-wrap svg{display:block;width:100%;height:100%}
.chart-empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);gap:4px;
}

/* ====================== F 编号角标（对应 PRD 功能编号） ====================== */
.fn{
  position:relative;display:inline-block;font-size:10px;line-height:1;color:var(--dim);
  border:1px solid var(--border);border-radius:4px;padding:2px 4px;cursor:help;
  vertical-align:middle;user-select:none;
}
.fn:hover{color:#d1d5db;border-color:var(--border-hi)}
.fn:hover::after{
  content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:60;
  background:var(--panel);border:1px solid var(--border-hi);color:#d1d5db;
  padding:6px 10px;border-radius:6px;font-size:11px;line-height:1.6;
  white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);
}

/* ====================== 页脚编号图例 ====================== */
.footer{
  flex:0 0 auto;padding:12px 16px;border-top:1px solid var(--border);
  color:var(--dim);font-size:11px;line-height:2;
}
.footer .fn{margin:0 2px}

/* ====================== 视图切换动画 ====================== */
.view-anim{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 暗色滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 标题栏：标题 + 更新时间 + 刷新（模拟样式） ===== -->
  <header class="titlebar">
    <div class="tb-left">
      <span class="tb-title">大盘行情看板</span>
      <span class="fn" data-tip="F1.2 自动轮询刷新：桌面端每 3 秒、移动端每 15 秒；切后台暂停，回前台立即刷新（原型以演示时钟模拟）">F1.2</span>
    </div>
    <div class="tb-right">
      <span class="tb-time" id="lastUpdate">10:47:32</span>
      <button class="tb-btn" id="refreshBtn">刷新</button>
      <span class="fn" data-tip="F1.3 手动刷新：点击立即触发一次数据拉取（原型模拟脉动反馈）">F1.3</span>
      <span class="pulse" id="pulseDot" hidden></span>
    </div>
  </header>

  <!-- ===== 主内容区：两个视图由 JS 显示/隐藏（模拟 SPA 路由） ===== -->
  <main class="main">
    <!-- 视图 1：行情看板（JS 渲染） -->
    <section id="viewBoard"></section>
    <!-- 视图 2：指数详情（JS 渲染） -->
    <section id="viewDetail" hidden></section>
  </main>

  <!-- ===== 页脚：编号图例 + 演示说明 ===== -->
  <footer class="footer">
    <div>编号角标对应《产品需求文档.md》功能：<span class="fn" data-tip="F1.1 指数卡片列表：三市场分组、红涨绿跌、左色条随涨跌变化、点击进入详情">F1.1</span> 指数卡片列表 ·
      <span class="fn" data-tip="F1.2 自动轮询刷新：桌面 3s / 移动 15s，刷新期间显示更新时间">F1.2</span> 自动轮询 ·
      <span class="fn" data-tip="F1.3 手动刷新：标题栏「刷新」按钮立即拉取一次数据">F1.3</span> 手动刷新 ·
      <span class="fn" data-tip="F2.1 实时报价头部：名称/代码/返回按钮/点位大字/涨跌额/涨跌幅，与看板数据同源">F2.1</span> 实时报价头部 ·
      <span class="fn" data-tip="F2.2 分时图：左右双轴对称缩放、昨收虚线居中、面积渐变、量副图（4:1）、全天时间轴预留、十字光标">F2.2</span> 分时图 ·
      <span class="fn" data-tip="F2.3 K线图：蜡烛 + MA5/10/20（黄/蓝/紫）+ 量副图，日K/周K/月K 切换，60s TTL 缓存">F2.3</span> K线图 ·
      <span class="fn" data-tip="F2.4 导航返回：详情页返回按钮，桌面端支持 ESC 键，返回后看板状态保持">F2.4</span> 导航返回
    </div>
    <div>演示快照：静态 mock 数据（截至 10:47，上证指数 3942.54 −0.94%）；分时走势仅绘制至 10:47、右侧预留全天宽度；本页零网络请求，双击离线打开。</div>
  </footer>
</div>

<script>
'use strict';
/* ======================================================================
 * 0. 通用格式化 —— 逻辑与 src/utils/format.ts 完全对齐（高保真要求）
 * ==================================================================== */
function fmtPrice(v){ return v.toFixed(2); }
function fmtChange(v){ return (v > 0 ? '+' : '') + v.toFixed(2); }
function fmtChangePct(v){ return (v > 0 ? '+' : '') + v.toFixed(2) + '%'; }
function fmtVolume(v){ return v >= 10000 ? (v / 10000).toFixed(2) + '亿' : v.toFixed(0) + '万'; }
function fmtAmount(v){ return v >= 10000 ? (v / 10000).toFixed(2) + '亿' : v.toFixed(0) + '万'; }
function trendOf(change){ return change > 0 ? 'up' : change < 0 ? 'down' : 'flat'; }
function round2(v){ return Math.round(v * 100) / 100; }

/* ======================================================================
 * 1. Mock 行情数据（演示快照，有涨有跌有平）
 *    volume 单位：万手；amount 单位：万元（与 format.ts 入参口径一致）
 * ==================================================================== */
const INDICES = [
  // ---- A 股 ----
  { code:'sh000001', name:'上证指数', market:'A 股', current:3942.54,  change:-37.35,  change_pct:-0.94, volume:37200, amount:52684000 },
  { code:'sz399001', name:'深证成指', market:'A 股', current:13104.28, change:85.62,   change_pct:0.66,  volume:45800, amount:63921500 },
  { code:'sz399006', name:'创业板指', market:'A 股', current:2876.35,  change:-21.09,  change_pct:-0.73, volume:13600, amount:29846200 },
  { code:'sh000300', name:'沪深300',  market:'A 股', current:4491.72,  change:-28.45,  change_pct:-0.63, volume:18500, amount:31053300 },
  { code:'sh000016', name:'上证50',   market:'A 股', current:2718.46,  change:5.12,    change_pct:0.19,  volume:5200,  amount:8764400 },
  { code:'sh000905', name:'中证500',  market:'A 股', current:6123.57,  change:0,       change_pct:0,     volume:12100, amount:18639000 },
  // ---- 港股 ----
  { code:'hkHSI',    name:'恒生指数', market:'港 股', current:24105.63, change:-182.47, change_pct:-0.75, volume:20350, amount:8564200 },
  { code:'hkHSTECH', name:'恒生科技', market:'港 股', current:5312.88,  change:45.20,   change_pct:0.86,  volume:6120,  amount:2158800 },
  // ---- 美股 ----
  { code:'usDJI',    name:'道琼斯',   market:'美 股', current:44296.51, change:156.32,  change_pct:0.35,  volume:3520,  amount:5421000 },
  { code:'usIXIC',   name:'纳斯达克', market:'美 股', current:19003.65, change:-95.67,  change_pct:-0.50, volume:5860,  amount:8963500 },
  { code:'usSPX',    name:'标普500',  market:'美 股', current:6031.88,  change:12.07,   change_pct:0.20,  volume:4230,  amount:7654400 },
];
const MARKET_GROUPS = ['A 股', '港 股', '美 股'];
function byCode(code){ return INDICES.find(d => d.code === code) || null; }

/* ======================================================================
 * 2. 种子随机（固定种子 → 每次打开原型走势一致，稳定可复现）
 * ==================================================================== */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ======================================================================
 * 3. 分时 mock 数据（按指数缩放：走势形态模板取自上证快照，各指数围绕
 *    自身昨收等比缩放 + 独立种子噪声，末点对齐卡片报价，保证分时/左轴
 *    刻度与详情页头部报价自洽）
 *    · A 股全天 242 点（09:30–11:30 121 点 + 13:00–15:00 121 点）
 *    · 走势只生成到 index 77（10:47），右侧宽度全天预留
 * ==================================================================== */
const MINUTE_TPL = {
  prevClose: 3979.89,        // 上证昨收（缩放基准）
  axisMax: 4027.04,          // 左轴顶 = +1.18%
  axisMin: 3932.74,          // 左轴底 = −1.18%（围绕昨收对称）
  axisPcts: ['+1.18%', '+0.79%', '+0.39%', '0.00%', '-0.39%', '-0.79%', '-1.18%'],
  fullDay: 242,              // 全天分时点数（时间轴宽度基准）
  lastIdx: 77,               // 10:47 → 上午第 77 分钟
  timeTicks: [[0, '09:30'], [30, '10:00'], [60, '10:30'], [120, '11:30'], [180, '14:00'], [241, '15:00']],
  noiseAmp: 3.4,             // 分钟噪声幅度（以上证昨收为口径，按昨收比缩放）
  // 走势锚点（上证绝对价）：早盘冲高（约 +0.54%）→ 回落跌破昨收 → 10:47 收于 3942.54
  anchors: [
    [0, 3985.20], [6, 3990.50], [14, 3998.80], [22, 4001.20], [30, 3996.40],
    [38, 3990.10], [44, 3983.60], [50, 3975.20], [56, 3967.80],
    [62, 3958.40], [68, 3950.60], [74, 3944.20], [77, 3942.54],
  ],
};
// 分时点 index → 真实 "HH:MM"（消除午休空洞的合成时间轴，同 MinuteChart.vue 思路）
function idxToTime(i){
  const m = i <= 120 ? 9 * 60 + 30 + i : 13 * 60 + (i - 121);
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
// 由 code 派生稳定种子：同 code 每次打开走势一致，不同 code 噪声相位不同
function codeSeed(code){
  let h = 0;
  for (let k = 0; k < code.length; k++) h = (h * 31 + code.charCodeAt(k)) | 0;
  return h >>> 0;
}
// 生成某指数的分时数据：昨收 = 现价 − 涨跌额（与卡片报价同源），
// 锚点 / 轴刻度 / 噪声全部按「昨收之比」等比缩放，末点 = 卡片现价
function minuteDataFor(d){
  const tpl = MINUTE_TPL;
  const prevClose = round2(d.current - d.change);
  const scale = prevClose / tpl.prevClose;
  const anchors = tpl.anchors.map(([i, p]) => [i, p * scale]);
  const rnd = mulberry32((20260902 ^ codeSeed(d.code)) >>> 0);
  const pts = [];
  for (let i = 0; i <= tpl.lastIdx; i++){
    // 锚点间线性插值 + 轻噪声（首点与终点无噪声，保证形态可控）
    let a = anchors[0], b = anchors[anchors.length - 1];
    for (let k = 0; k < anchors.length - 1; k++){
      if (i >= anchors[k][0] && i <= anchors[k + 1][0]){ a = anchors[k]; b = anchors[k + 1]; break; }
    }
    const t = (i - a[0]) / Math.max(1, b[0] - a[0]);
    let price = a[1] + (b[1] - a[1]) * t + (i === 0 ? 0 : (rnd() - 0.5) * tpl.noiseAmp * scale);
    if (i === tpl.lastIdx) price = d.current;
    // 分钟量：开盘脉冲放大 + 随机（万手级演示值）
    const openPulse = i < 5 ? 2.6 - i * 0.35 : 1;
    const vol = round2((2.2 + rnd() * 4.6) * openPulse);
    pts.push({ i, time: idxToTime(i), price: round2(price), vol });
  }
  const axisMax = round2(tpl.axisMax * scale);
  const axisMin = round2(tpl.axisMin * scale);
  const axisPrices = tpl.axisPcts.map((_, k) => round2(axisMax - k * (axisMax - axisMin) / 6));
  return {
    code: d.code, name: d.name, prevClose,
    axisMax, axisMin, axisPrices, axisPcts: tpl.axisPcts,
    fullDay: tpl.fullDay, lastIdx: tpl.lastIdx, timeTicks: tpl.timeTicks, pts,
  };
}
const MINUTE_CACHE = {};   // 同指数不重复生成（mock 缓存）
function getMinuteData(code){
  if (!MINUTE_CACHE[code]) MINUTE_CACHE[code] = minuteDataFor(byCode(code));
  return MINUTE_CACHE[code];
}

/* ======================================================================
 * 4. K线 mock 数据（日K 30 根 / 周K 18 根 / 月K 12 根，末根对齐看板报价）
 * ==================================================================== */
function genDates(period, n){
  const out = [];
  if (period === 'day'){
    const d = new Date(2026, 7, 31);            // 2026-08-31（周一，月份从 0 计）向前取工作日
    while (out.length < n){
      const wd = d.getDay();
      if (wd !== 0 && wd !== 6) out.unshift(fmtDate(d));
      d.setDate(d.getDate() - 1);
    }
  } else if (period === 'week'){
    const d = new Date(2026, 7, 31);
    for (let i = 0; i < n; i++){ out.unshift(fmtDate(d)); d.setDate(d.getDate() - 7); }
  } else {
    const m = new Date(2026, 8, 1);
    for (let i = 0; i < n; i++){ out.unshift(fmtMonth(m)); m.setMonth(m.getMonth() - 1); }
  }
  return out;
}
function fmtDate(d){ return (d.getMonth() + 1) + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtMonth(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

// 周期参数：起始位按「上证快照起始价 / 上证收盘」比例给出（随各指数点位等比缩放）、
// 主升段（斜率/根数）、回调段；末根 close 强制为该指数卡片报价
const KLINE_CFG = {
  day:   { n: 30, seed: 1101, ratio: 3862.40 / 3942.54, rise: [0.0018, 22], tail: [-0.0024, 8] },
  week:  { n: 18, seed: 2202, ratio: 3824.60 / 3942.54, rise: [0.0035, 13], tail: [-0.0037, 5] },
  month: { n: 12, seed: 3303, ratio: 3652.80 / 3942.54, rise: [0.0110, 9],  tail: [-0.0073, 3] },
};
function genKline(period, d){
  const cfg = KLINE_CFG[period];
  const rnd = mulberry32((cfg.seed ^ codeSeed(d.code)) >>> 0);
  const dates = genDates(period, cfg.n);
  const bars = [];
  let prev = d.current * cfg.ratio;                          // 起始位随指数点位等比缩放
  for (let i = 0; i < cfg.n; i++){
    const drift = i < cfg.rise[1] ? cfg.rise[0] : cfg.tail[0];
    const noise = (rnd() - 0.5) * 0.008;
    const open = prev * (1 + noise * 0.35);
    let close = open * (1 + drift + noise);
    if (i === cfg.n - 1) close = d.current;                  // 末根与看板报价一致
    const hi = Math.max(open, close), lo = Math.min(open, close);
    const high = hi * (1 + rnd() * 0.004 + 0.0008);
    const low  = lo * (1 - rnd() * 0.004 - 0.0008);
    const vol  = Math.round((1.8 + Math.abs(close - open) / open * 220 + rnd() * 1.6) * 10000);
    bars.push({ date: dates[i], open: round2(open), high: round2(high), low: round2(low), close: round2(close), volume: vol });
    prev = close;
  }
  return bars;
}
const KLINE_CACHE = {};   // 同指数同周期不重复生成（对应 F2.3 数据缓存语义）
function getKline(code, period){
  const key = code + ':' + period;
  if (!KLINE_CACHE[key]) KLINE_CACHE[key] = genKline(period, byCode(code));
  return KLINE_CACHE[key];
}
// 简单移动平均（前 n-1 项为 null，同 src/utils/indicator.ts 语义）
function maCalc(closes, n){
  const out = new Array(closes.length).fill(null);
  let s = 0;
  for (let i = 0; i < closes.length; i++){
    s += closes[i];
    if (i >= n) s -= closes[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}

/* ---- 十字光标轴气泡：定位 rect+text 并写入文本/颜色 ---- */
function setBubble(g, cx, cy, text, color){
  const rect = g.querySelector('rect'), t = g.querySelector('text');
  const w = Math.max(36, text.length * 6.5 + 8);
  rect.setAttribute('x', (cx - w / 2).toFixed(1));

  t.setAttribute('x', cx.toFixed(1));
  t.setAttribute('y', cy.toFixed(1));

}

/* =====================================================================
 * 9.1 分时图（F2.2）—— 内联 SVG 绘制
 *   · 左轴 7 档点位 / 右轴 7 档涨跌幅，围绕昨收对称缩放、刻度严格水平对齐
 *   · 昨收虚线恒居垂直正中，左端「昨收」标签（置虚线下方 + 深色底衬）
 *   · 价格折线（绿，跌）+ 底部渐变面积 + 半透明水平网格
 *   · 量副图独立分区（主图:量区 ≈ 4:1），分钟量柱红涨绿跌
 *   · 走势只画到 10:47（index 77），右侧按全天 242 点预留宽度
 * =================================================================== */
function renderMinuteChart(wrap){
  const W = wrap.clientWidth || 840;
  const H = wrap.clientHeight || 320;
  const padL = 52, padR = 52, padT = 6;
  const plotH = Math.round(H * 0.66);      // 主图（与量区约 4:1）
  const gap = 12;
  const volH = Math.round(H * 0.17);
  const plotW = W - padL - padR;
  const plotB = padT + plotH;
  const volB = padT + plotH + gap + volH;

  const M = getMinuteData(currentCode);
  const { name, prevClose, axisMax, axisMin, axisPrices, axisPcts, fullDay, lastIdx, timeTicks } = M;
  // 价格 → y：围绕昨收对称的线性映射（昨收恒居正中）
  const y = p => padT + (axisMax - p) / (axisMax - axisMin) * plotH;
  // index → x：两端各留 4 bar 空白（同 MinuteChart.vue 的 setVisibleLogicalRange）
  const x = i => padL + ((i + 4) / (fullDay + 8)) * plotW;
  const barW = plotW / (fullDay + 8);

  const ptsXY = M.pts.map(p => ({ ...p, px: x(p.i), py: y(p.price) }));

  // 走势线与面积（面积渐变：顶 0.25 → 底透明，同 AreaSeries topColor/bottomColor）
  const linePath = ptsXY.map((p, i) => (i === 0 ? 'M' : 'L') + p.px.toFixed(1) + ',' + p.py.toFixed(1)).join(' ');
  const areaPath = linePath
    + ' L ' + ptsXY[ptsXY.length - 1].px.toFixed(1) + ',' + plotB
    + ' L ' + ptsXY[0].px.toFixed(1) + ',' + plotB + ' Z';

  // 半透明水平网格 + 左右双轴 7 档刻度（同一 y，严格水平对齐）
  let gridLines = '', tickL = '', tickR = '';
  for (let k = 0; k < 7; k++){
    const gy = padT + k * plotH / 6;
    gridLines += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="${GRID}" stroke-opacity="0.55"/>`;
    tickL += `<text x="${padL - 6}" y="${gy.toFixed(1)}" dy="0.32em" text-anchor="end" font-size="10" fill="${AXIS}" font-variant-numeric="tabular-nums">${axisPrices[k].toFixed(2)}</text>`;
    tickR += `<text x="${W - padR + 6}" y="${gy.toFixed(1)}" dy="0.32em" text-anchor="start" font-size="10" fill="${AXIS}" font-variant-numeric="tabular-nums">${axisPcts[k]}</text>`;
  }

  // 昨收基准虚线（对称缩放下居中）+ 左端「昨收」标签：
  // 标签置于虚线下方并加深色底衬，避开左上角走势起始段与面积渐变
  const prevY = y(prevClose);
  const prevLine = `
    <line x1="${padL}" y1="${prevY.toFixed(1)}" x2="${W - padR}" y2="${prevY.toFixed(1)}" stroke="${AXIS}" stroke-dasharray="4 3"/>
    <rect x="${(padL + 2).toFixed(1)}" y="${(prevY + 3).toFixed(1)}" width="28" height="13" rx="2" fill="#111827" fill-opacity="0.9"/>
    <text x="${(padL + 4).toFixed(1)}" y="${(prevY + 12.5).toFixed(1)}" text-anchor="start" font-size="10" fill="${AXIS}">昨收</text>`;

  // 分钟量柱：与上一分钟价比较，首根对照昨收（同 volumeColorAt 逻辑）
  let maxVol = 0;
  for (const p of M.pts) maxVol = Math.max(maxVol, p.vol);
  let volBars = `<line x1="${padL}" y1="${volB}" x2="${W - padR}" y2="${volB}" stroke="${GRID}" stroke-opacity="0.8"/>`;
  for (let i = 0; i < ptsXY.length; i++){
    const p = ptsXY[i];
    const refPrice = i > 0 ? M.pts[i - 1].price : prevClose;
    const c = p.price >= refPrice ? UP : DOWN;
    const h = Math.max(1, volH * p.vol / maxVol);
    volBars += `<rect x="${(p.px - barW * 0.35).toFixed(1)}" y="${(volB - h).toFixed(1)}" width="${(barW * 0.7).toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" fill-opacity="0.85"/>`;
  }

  // 时间轴：全天刻度固定（09:30/10:00/10:30/11:30/14:00/15:00）
  let timeTexts = '';
  for (const [idx, label] of timeTicks){
    const anchor = idx === 0 ? 'start' : idx >= fullDay - 1 ? 'end' : 'middle';
    timeTexts += `<text x="${x(idx).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" font-size="10" fill="${AXIS}">${label}</text>`;
  }

  wrap.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${name}分时图">
    <defs>
      <linearGradient id="gradMinute" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${DOWN}" stop-opacity="0.25"/>
        <stop offset="1" stop-color="${DOWN}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridLines}${tickL}${tickR}
    <path d="${areaPath}" fill="url(#gradMinute)"/>
    <path d="${linePath}" fill="none" stroke="${DOWN}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${prevLine}
    ${volBars}
    ${timeTexts}
    <g id="mCross" style="display:none" pointer-events="none">
      <line id="mCrossV" y1="${padT}" y2="${volB}" stroke="#6b7280" stroke-dasharray="3 3"/>
      <line id="mCrossH" x1="${padL}" x2="${W - padR}" stroke="#6b7280" stroke-dasharray="3 3"/>
      <circle id="mDot" r="3" fill="${DOWN}" stroke="#111827" stroke-width="1"/>
      <g id="mTipL"><rect height="16" rx="3" fill="#4b5563"/><text font-size="10" text-anchor="middle" dy="0.32em" font-variant-numeric="tabular-nums"/></g>
      <g id="mTipR"><rect height="16" rx="3" fill="#4b5563"/><text font-size="10" text-anchor="middle" dy="0.32em" font-variant-numeric="tabular-nums"/></g>
      <g id="mTipT"><rect height="16" rx="3" fill="#4b5563"/><text font-size="10" text-anchor="middle" dy="0.32em"/></g>
    </g>
    <rect id="mHit" x="${padL}" y="${padT}" width="${plotW}" height="${volB - padT}" fill="transparent"/>
  </svg>`;

  bindMinuteCrosshair(wrap.querySelector('svg'), { W, padL, padR, padT, volB, barW, y, x, M });
}

/* ---- 分时图十字光标：吸附最近分钟点，左右轴气泡同步该点价格/涨跌幅 ---- */
function bindMinuteCrosshair(svg, geo){
  const hit = svg.querySelector('#mHit');
  const cross = svg.querySelector('#mCross');
  const v = svg.querySelector('#mCrossV'), h = svg.querySelector('#mCrossH');
  const dot = svg.querySelector('#mDot');
  const tipL = svg.querySelector('#mTipL'), tipR = svg.querySelector('#mTipR'), tipT = svg.querySelector('#mTipT');
  const { W, padL, padR, padT, volB, barW, y, x, M } = geo;
  hit.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    let i = Math.round((ev.clientX - r.left - padL) / barW - 4);
    i = Math.max(0, Math.min(M.lastIdx, i));
    const p = M.pts[i];
    const cx = x(p.i), cy = y(p.price);
    cross.style.display = '';
    v.setAttribute('x1', cx.toFixed(1)); v.setAttribute('x2', cx.toFixed(1));
    h.setAttribute('y1', cy.toFixed(1)); h.setAttribute('y2', cy.toFixed(1));
    dot.setAttribute('cx', cx.toFixed(1)); dot.setAttribute('cy', cy.toFixed(1));
    const pct = (p.price - M.prevClose) / M.prevClose * 100;
    const pctText = (pct > 0 ? '+' : '') + pct.toFixed(2) + '%';
    const c = pct > 0 ? UP : pct < 0 ? DOWN : AXIS;
    setBubble(tipL, padL / 2, cy, p.price.toFixed(2), c);      // 左轴：该点指数
    setBubble(tipR, W - padR / 2, cy, pctText, c);             // 右轴：该点涨跌幅
    setBubble(tipT, Math.min(W - padR - 20, Math.max(padL + 20, cx)), volB + 11, p.time, '#fff');
  });
  hit.addEventListener('mouseleave', () => { cross.style.display = 'none'; });
}

/* =====================================================================
 * 9.2 K线图（F2.3）—— 内联 SVG 绘制
 *   · 蜡烛图（红涨 #ef232a / 绿跌 #14b143，含影线）+ MA5/10/20（黄/蓝/紫）
 *   · 右轴价格刻度 + 量副图（4:1）涨红跌绿 + 左上角 MA 图例
 *   · 日K 30 根 / 周K 18 根 / 月K 12 根（周期越长柱数越少、单根波幅越大）
 * =================================================================== */
function renderKlineChart(wrap, bars){
  const W = wrap.clientWidth || 840;
  const H = wrap.clientHeight || 320;
  const padL = 8, padR = 56, padT = 6;
  const plotH = Math.round(H * 0.66);
  const gap = 12;
  const volH = Math.round(H * 0.17);
  const plotW = W - padL - padR;
  const plotB = padT + plotH;
  const volB = padT + plotH + gap + volH;

  // MA5/10/20：先计算，并将 MA 值纳入价格范围（同 lightweight-charts autoscale 行为，
  // 避免近期从高位回落时 MA20 高于全部蜡烛、均线画出主图顶部）；
  // 前 n-1 项 null 断笔（同 ma() 语义），MA20 在周K/月K 柱数不足时自然缺省
  const closes = bars.map(b => b.close);
  const periods = [5, 10, 20];
  const mas = periods.map(m => maCalc(closes, m));
  let hi = -Infinity, lo = Infinity;
  for (const b of bars){ hi = Math.max(hi, b.high); lo = Math.min(lo, b.low); }
  for (const vals of mas){
    for (const v of vals){
      if (v === null) continue;
      hi = Math.max(hi, v); lo = Math.min(lo, v);
    }
  }
  const pad = (hi - lo) * 0.06;
  hi += pad; lo -= pad;
  const y = v => padT + (hi - v) / (hi - lo) * plotH;

  const n = bars.length;
  const slot = plotW / n;
  const bw = Math.max(2, slot * 0.62);
  const cx = i => padL + slot * (i + 0.5);

  // 水平网格 + 右轴 6 档价格刻度
  let gridLines = '', tickR = '';
  for (let k = 0; k < 6; k++){
    const gy = padT + k * plotH / 5;
    const v = hi - k * (hi - lo) / 5;
    gridLines += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="${GRID}" stroke-opacity="0.55"/>`;
    tickR += `<text x="${W - padR + 6}" y="${gy.toFixed(1)}" dy="0.32em" text-anchor="start" font-size="10" fill="${AXIS}" font-variant-numeric="tabular-nums">${v.toFixed(2)}</text>`;
  }

  // MA 折线（范围已纳入 MA 值）：MA20 在周K/月K 柱数不足时自然缺省
  let maPaths = '';
  mas.forEach((vals, mi) => {
    let d = '', pen = false;
    vals.forEach((v, i) => {
      if (v === null){ pen = false; return; }
      d += (pen ? ' L' : ' M') + cx(i).toFixed(1) + ',' + y(v).toFixed(1);
      pen = true;
    });
    if (d) maPaths += `<path d="${d}" fill="none" stroke="${MA_COLORS[mi]}" stroke-width="1"/>`;
  });
  // 左上角图例：最新一根的 MA 值（同 KlineChart.vue）
  const legend = mas.map((vals, mi) => {
    const last = vals[vals.length - 1];
    return `<text x="${8 + mi * 78}" y="14" font-size="10" fill="${MA_COLORS[mi]}">MA${periods[mi]} ${last === null || last === undefined ? '--' : last.toFixed(2)}</text>`;
  }).join('');

  // 蜡烛 + 影线（borderVisible=false 风格：实体与影线同色）
  let candles = '';
  bars.forEach((b, i) => {
    const c = b.close >= b.open ? UP : DOWN;
    const yO = y(b.open), yC = y(b.close);
    const top = Math.min(yO, yC), hgt = Math.max(1, Math.abs(yO - yC));
    candles += `<line x1="${cx(i).toFixed(1)}" y1="${y(b.high).toFixed(1)}" x2="${cx(i).toFixed(1)}" y2="${y(b.low).toFixed(1)}" stroke="${c}"/>`
      + `<rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${c}"/>`;
  });

  // 量副图：量柱随当日涨跌着色
  let maxVol = 0;
  for (const b of bars) maxVol = Math.max(maxVol, b.volume);
  let volBars = `<line x1="${padL}" y1="${volB}" x2="${W - padR}" y2="${volB}" stroke="${GRID}" stroke-opacity="0.8"/>`;
  bars.forEach((b, i) => {
    const c = b.close >= b.open ? UP : DOWN;
    const h = Math.max(1, volH * b.volume / maxVol);
    volBars += `<rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${(volB - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" fill-opacity="0.85"/>`;
  });

  // 时间轴：5 个均匀索引的日期标签
  const idxs = [0, Math.round(n * 0.25), Math.round(n * 0.5), Math.round(n * 0.75), n - 1];
  let timeTexts = '';
  idxs.forEach((idx, k) => {
    const anchor = k === 0 ? 'start' : k === idxs.length - 1 ? 'end' : 'middle';
    timeTexts += `<text x="${cx(idx).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" font-size="10" fill="${AXIS}">${bars[idx].date}</text>`;
  });

  wrap.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="K线图">
    ${gridLines}${tickR}${legend}
    ${maPaths}
    ${candles}
    ${volBars}
    ${timeTexts}
    <g id="kCross" style="display:none" pointer-events="none">
      <line id="kCrossV" y1="${padT}" y2="${volB}" stroke="#6b7280" stroke-dasharray="3 3"/>
      <g id="kTipR"><rect height="16" rx="3" fill="#4b5563"/><text font-size="10" text-anchor="middle" dy="0.32em" font-variant-numeric="tabular-nums"/></g>
      <g id="kTipT"><rect height="16" rx="3" fill="#4b5563"/><text font-size="10" text-anchor="middle" dy="0.32em"/></g>
    </g>
    <rect id="kHit" x="${padL}" y="${padT}" width="${plotW}" height="${volB - padT}" fill="transparent"/>
  </svg>`;

  bindKlineCrosshair(wrap.querySelector('svg'), { W, padL, padR, padT, plotB, plotH, hi, lo, volB, slot, bars });
}

/* ---- K线十字光标：竖线吸附最近蜡烛，右轴气泡跟随鼠标反算价格 ---- */
function bindKlineCrosshair(svg, geo){
  const hit = svg.querySelector('#kHit');
  const cross = svg.querySelector('#kCross');
  const v = svg.querySelector('#kCrossV');
  const tipR = svg.querySelector('#kTipR'), tipT = svg.querySelector('#kTipT');
  const { W, padL, padR, padT, plotB, plotH, hi, lo, volB, slot, bars } = geo;
  const n = bars.length;
  hit.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    let i = Math.floor((ev.clientX - r.left - padL) / slot);
    i = Math.max(0, Math.min(n - 1, i));
    const b = bars[i];
    const cx = padL + slot * (i + 0.5);
    cross.style.display = '';
    v.setAttribute('x1', cx.toFixed(1)); v.setAttribute('x2', cx.toFixed(1));
    // 右轴价格气泡：跟随鼠标 y 反算（clamp 到主图区）
    const my = Math.min(plotB, Math.max(padT, ev.clientY - r.top));
    const price = hi - (my - padT) / plotH * (hi - lo);
    setBubble(tipR, W - padR / 2, my, price.toFixed(2), '#fff');
    setBubble(tipT, Math.min(W - padR - 24, Math.max(padL + 24, cx)), volB + 11, b.date, '#fff');
  });
  hit.addEventListener('mouseleave', () => { cross.style.display = 'none'; });
}

let resizeTimer = null;
function drawChart(){
  const wrap = document.getElementById('chartWrap');
  if (!wrap) return;
  if (activeTab === 'minute') renderMinuteChart(wrap);
  else renderKlineChart(wrap, getKline(currentCode, activeTab));
}
window.addEventListener('resize', () => {
  if (viewDetail.hidden) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawChart, 120);
});

/* ======================================================================
 * 10. 启动
 * ==================================================================== */
renderBoard();
renderClock();
route();
</script>
