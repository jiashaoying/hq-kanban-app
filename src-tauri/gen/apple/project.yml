name: hq-kanban-app
options:
  bundleIdPrefix: com.huafu.hqkanbanapp
  # iOS 26+ (TN3187) 要求最低部署目标 ≥ 15.0，维持 14.0 会在启动时触发
  # UIKit 运行时告警并与 Scene 生命周期适配冲突。改这里（不要直接改 pbxproj）。
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: 大盘行情看板
      PRODUCT_BUNDLE_IDENTIFIER: com.huafu.hqkanbanapp
      DEVELOPMENT_TEAM: QZ5VGE4SZ9
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  hq-kanban-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: hq-kanban-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: hq-kanban-app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS 26+ (TN3187) 强制 UIScene 生命周期：缺失时 UIKit 在 UIApplicationMain 内抛出
        # Runtime Issue 并触发 EXC_BREAKPOINT/SIGTRAP，表现为启动即闪退。
        # UIApplicationSupportsMultipleScenes 必须为 true，否则 tao 不会调用 setWindowScene，
        # UIWindow 挂不到 windowScene 上 → 黑屏。名称需与 tao 的 TaoSceneDelegate 一致。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: TaoScene
                UISceneDelegateClassName: TaoSceneDelegate
    entitlements:
      path: hq-kanban-app_iOS/hq-kanban-app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - script: |
          set -e
          export PATH="$HOME/.cargo/bin:$HOME/.rustup/toolchains/stable-aarch64-apple-darwin/bin:/opt/homebrew/bin:$PATH"
          cd "${SRCROOT}/../../../"
          if [ "${PLATFORM_DISPLAY_NAME}" = "iOS Simulator" ]; then
            TARGET="aarch64-apple-ios-sim"
          else
            TARGET="aarch64-apple-ios"
          fi
          if [ "${CONFIGURATION}" = "release" ]; then
            CARGO_FLAGS="--release --features tauri/custom-protocol"
          fi
          cargo build --target "$TARGET" --lib --manifest-path src-tauri/Cargo.toml $CARGO_FLAGS
          mkdir -p "${SRCROOT}/Externals/arm64/${CONFIGURATION}"
          cp "src-tauri/target/${TARGET}/${CONFIGURATION}/libhq_kanban_app_lib.a" "${SRCROOT}/Externals/arm64/${CONFIGURATION}/libapp.a"
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a