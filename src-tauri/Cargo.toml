[package]
name = "hq-kanban-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib target unique and does not conflict with the bin target.
name = "hq_kanban_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[patch.crates-io]
wry = { path = "patches/wry-0.55.1" }
# iOS 26+ Scene 生命周期下 UISceneConfiguration 悬垂指针崩溃修复，见
# patches/tao-0.35.3/src/platform_impl/ios/view.rs（configuration_for_connecting_scene_session）
tao = { path = "patches/tao-0.35.3" }
